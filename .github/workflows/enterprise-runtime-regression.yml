name: Enterprise runtime regression

on:
  push:
    branches:
      - fix/enterprise-runtime-verification-20261102
    paths:
      - 'src/store/EnterpriseRuntimeStore.ts'
      - 'src/store/__tests__/EnterpriseRuntimeStore.test.ts'
      - '.github/workflows/enterprise-runtime-regression.yml'
  pull_request:
    paths:
      - 'src/store/EnterpriseRuntimeStore.ts'
      - 'src/store/__tests__/EnterpriseRuntimeStore.test.ts'
      - '.github/workflows/enterprise-runtime-regression.yml'

permissions:
  contents: read

jobs:
  runtime-jest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Enterprise runtime regression tests
        run: yarn test --runInBand --coverage=false src/store/__tests__/EnterpriseRuntimeStore.test.ts
      - name: TypeScript check
        run: yarn typecheck
