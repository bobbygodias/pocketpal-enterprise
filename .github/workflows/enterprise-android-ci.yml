name: Enterprise Android CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - enterprise/mega3-vulkan-ui

concurrency:
  group: enterprise-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint changed application code
        run: yarn eslint src/components/EnterpriseQuickPanel src/components/ChatHeader src/components/ChatHeaderTitle src/store/EnterpriseRuntimeStore.ts src/specs/NativeHardwareInfo.ts || true

      - name: Prepare llama.rn Vulkan backend
        run: bash scripts/prepare-llama-vulkan.sh

      # The upstream production Firebase config is intentionally not committed.
      # A local-only placeholder lets Gradle process the prodDebug variant while
      # keeping real credentials out of the fork. Local LLM/chat paths do not
      # depend on these placeholder Firebase values.
      - name: Create local CI Firebase placeholder
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pocketpal-enterprise-local",
              "storage_bucket": "pocketpal-enterprise-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyLOCAL_ONLY_PLACEHOLDER_NOT_A_REAL_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build prodDebug ARM64 APK with Vulkan llama.rn
        working-directory: android
        run: ./gradlew assembleProdDebug -PrnllamaBuildFromSource=true -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Collect APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-enterprise-mega3-vulkan-test-01
          path: android/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
          retention-days: 7
